  <main>
    <section class="profile-card">
      <h1 class="text-center">Part 2. jQuery Effects</h1>

      <div class="task">
        <h2>Task 2. Visibility Methods</h2>
        <p id="vis-text">This paragraph can be hidden and shown.</p>
        <button class="btn btn-dark" id="hide-btn">Hide</button>
        <button class="btn btn-dark" id="show-btn">Show</button>
        <button class="btn btn-outline-dark" id="toggle-btn">Toggle</button>
      </div>

      <div class="task">
        <h2>Task 3. Fade Methods</h2>
        <div class="img-box">
          <img id="fade-img" src="https://picsum.photos/id/10/400/250" alt="Forest">
        </div>
        <button class="btn btn-dark" id="fadein-btn">fadeIn</button>
        <button class="btn btn-dark" id="fadeout-btn">fadeOut</button>
        <button class="btn btn-outline-dark" id="fadetoggle-btn">fadeToggle</button>
      </div>

      <div class="task">
        <h2>Task 4. Slide Methods</h2>
        <button class="btn btn-dark" id="slideup-btn">slideUp</button>
        <button class="btn btn-dark" id="slidedown-btn">slideDown</button>
        <button class="btn btn-outline-dark" id="slidetoggle-btn">slideToggle</button>
        <div id="panel">This is a collapsible panel controlled with jQuery slide methods.</div>
      </div>
    </section>
  </main>
